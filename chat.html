<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpecRoute Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; color: #e94560; }
  #stats {
    font-size: 12px;
    color: #888;
    font-family: 'Courier New', monospace;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #0f3460;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #1f2940;
    border-bottom-left-radius: 4px;
  }
  .msg.assistant .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #e94560;
    animation: blink 0.6s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #input-area {
    padding: 16px 20px;
    background: #16213e;
    border-top: 1px solid #0f3460;
    display: flex;
    gap: 10px;
  }
  #input-area textarea {
    flex: 1;
    background: #1a1a2e;
    color: #e0e0e0;
    border: 1px solid #0f3460;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
  }
  #input-area textarea:focus { border-color: #e94560; }
  #input-area button {
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #input-area button:hover { background: #c73650; }
  #input-area button:disabled { background: #555; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>SpecRoute</h1>
  <div id="stats"></div>
</header>

<div id="chat"></div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
  <button id="send" onclick="send()">Send</button>
</div>

<script>
const API = "http://localhost:8000/v1/chat/completions";
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statsEl = document.getElementById("stats");
let messages = [];
let streaming = false;

inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = content;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;

  messages.push({ role: "user", content: text });
  addMessage("user", text);
  inputEl.value = "";
  inputEl.style.height = "auto";

  streaming = true;
  sendBtn.disabled = true;

  const el = addMessage("assistant", "");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  el.appendChild(cursor);

  const t0 = performance.now();
  let tokens = 0;
  let fullText = "";

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "specroute-hybrid", messages, stream: true }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split("\n");
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
        try {
          const data = JSON.parse(line.slice(6));
          const delta = data.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            tokens++;
            el.textContent = fullText;
            el.appendChild(cursor);
            chatEl.scrollTop = chatEl.scrollHeight;

            const elapsed = (performance.now() - t0) / 1000;
            statsEl.textContent = `${tokens} tokens | ${(tokens / elapsed).toFixed(1)} tok/s`;
          }
        } catch {}
      }
    }
  } catch (err) {
    fullText += "\n[Connection error: " + err.message + "]";
    el.textContent = fullText;
  }

  cursor.remove();
  messages.push({ role: "assistant", content: fullText });
  streaming = false;
  sendBtn.disabled = false;
  inputEl.focus();
}
</script>

</body>
</html>
